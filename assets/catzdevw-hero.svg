<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="title desc">
  <title id="title">CATZDEVW — animated cat terminal logo</title>
  <desc id="desc">Minimal violet and cyan CATZDEVW brand banner featuring a gently floating terminal-cat mascot and a blinking code cursor.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="0.58" stop-color="#11132c"/>
      <stop offset="1" stop-color="#201044"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3e8ff"/>
      <stop offset="0.58" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9ca3af" stroke-opacity=".055"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <style>
    .float { animation: float 5s ease-in-out infinite; transform-origin: 165px 150px; }
    .cursor { animation: blink 1.2s steps(1,end) infinite; }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-4px); } }
    @keyframes blink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
    @keyframes pulse { 0%,100% { opacity:.50; } 50% { opacity:1; } }
    @media (prefers-reduced-motion:reduce) {
      .float,.cursor,.pulse { animation:none; }
    }
  </style>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1197" height="297" rx="23" fill="none" stroke="#6d5ab6" stroke-opacity=".45" stroke-width="2"/>
  <rect x="35" y="24" width="4" height="252" rx="2" fill="url(#rail)" opacity=".8"/>
  <circle cx="170" cy="145" r="102" fill="#8b5cf6" opacity=".11" filter="url(#glow)"/>
  <g class="float">
    <!-- cat ears -->
    <path d="M80 112 L87 56 L127 82 Q163 65 202 82 L244 56 L251 112" fill="#5b21b6" stroke="#a78bfa" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M98 91 L100 74 L122 88" fill="#22d3ee" opacity=".8"/>
    <path d="M232 91 L230 74 L208 88" fill="#22d3ee" opacity=".8"/>
    <!-- terminal head -->
    <rect x="75" y="94" width="181" height="148" rx="32" fill="#6d28d9"/>
    <rect x="87" y="107" width="157" height="123" rx="25" fill="#0f172a"/>
    <circle cx="111" cy="125" r="4.5" fill="#f472b6"/>
    <circle cx="127" cy="125" r="4.5" fill="#fbbf24"/>
    <circle cx="143" cy="125" r="4.5" fill="#34d399"/>
    <!-- prompt face -->
    <path d="M121 158 L145 179 L121 200" fill="none" stroke="#22d3ee" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="161" y="196" width="43" height="9" rx="4.5" fill="#34d399" class="cursor"/>
    <!-- minimal whiskers -->
    <g stroke="#c4b5fd" stroke-width="3.5" stroke-linecap="round" opacity=".9">
      <path d="M78 176 L57 167 M77 191 L54 193"/>
      <path d="M253 176 L274 167 M254 191 L277 193"/>
    </g>
  </g>
  <g font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif">
    <text x="328" y="118" font-size="79" font-weight="800" letter-spacing="-2.3" fill="url(#word)">catzdevw</text>
    <rect x="724" y="68" width="7" height="57" rx="3" fill="#22d3ee" class="cursor"/>
    <text x="331" y="165" fill="#c4b5fd" font-size="20" font-weight="700" letter-spacing="4">FULL-STACK SOFTWARE ENGINEER</text>
    <text x="331" y="207" fill="#d1d5db" font-size="19" font-weight="500">React + TypeScript</text>
    <circle cx="535" cy="201" r="3" fill="#a78bfa"/>
    <text x="555" y="207" fill="#d1d5db" font-size="19" font-weight="500">Java + Spring Boot</text>
    <circle cx="774" cy="201" r="3" fill="#a78bfa"/>
    <text x="794" y="207" fill="#d1d5db" font-size="19" font-weight="500">PostgreSQL</text>
    <rect x="331" y="239" width="805" height="2" rx="1" fill="#64748b" opacity=".22"/>
    <rect x="331" y="239" width="150" height="2" rx="1" fill="url(#rail)" class="pulse"/>
    <text x="331" y="267" fill="#94a3b8" font-size="14" letter-spacing="2.6">BUILD  /  TEST  /  SHIP</text>
  </g>
  <circle cx="1120" cy="49" r="4" fill="#34d399" class="pulse"/>
  <text x="1110" y="54" font-family="Inter, Segoe UI, sans-serif" text-anchor="end" fill="#94a3b8" font-size="12" letter-spacing="2">CATZ</text>
</svg>
